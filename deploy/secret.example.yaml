# Copy to secret.yaml, fill in real values, apply it — and NEVER commit it.
#   cp secret.example.yaml secret.yaml && kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: avito-vacancy-bot
  namespace: avito-vacancy-bot
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: "<token от @BotFather>"
  TELEGRAM_CHAT_ID: "<id чата, узнать можно через @userinfobot>"
